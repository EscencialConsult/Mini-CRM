# Variables del sitio (Site configuration > Environment variables):
# VITE_SUPABASE_URL, VITE_SB_PUBLISHABLE_KEY y VITE_LANDINGS_URL.
# Las landings se sirven desde netlify/edge-functions/landing.ts en el host de
# VITE_LANDINGS_URL, agregado al sitio como alias de dominio.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
