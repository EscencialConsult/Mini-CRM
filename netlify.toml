# Variables del sitio (Site configuration > Environment variables):
# VITE_SUPABASE_URL, VITE_SB_PUBLISHABLE_KEY y VITE_LANDINGS_URL.
# Las landings se sirven desde netlify/edge-functions/landing.ts en el host de
# VITE_LANDINGS_URL, agregado al sitio como alias de dominio.
#
# Para el asistente (netlify/functions/asistente.ts):
# ANTHROPIC_API_KEY, marcada como secreta y solo para Functions (no para el build).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Estos headers valen para los archivos del CRM. Las edge functions (las landings)
# arman los suyos, con su propia política.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

    # Política de contenido, en dos tiempos:
    # 1) Estas directivas ya se hacen cumplir: ninguna pantalla del CRM las necesita.
    Content-Security-Policy = "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'"
    # 2) La política completa (de dónde pueden venir scripts, estilos, conexiones...) corre
    #    en modo prueba: el navegador NO bloquea nada, solo avisa en la consola
    #    ("Content-Security-Policy-Report-Only") cuando algo la incumpliría. Para activarla:
    #    navegar todos los módulos con la consola abierta, y si no hay avisos, pasar este
    #    valor a "Content-Security-Policy" (unificando con la línea de arriba).
    #    Ojo: la vista previa de las landings es una pestaña blob que hereda la política del
    #    CRM y corre scripts propios; al activarla hay que moverla a un iframe con sandbox.
    #    Si cambia el proyecto de Supabase, actualizar su dirección en connect-src.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://dzabqnznnotkztrdextl.supabase.co wss://dzabqnznnotkztrdextl.supabase.co; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; manifest-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'"
